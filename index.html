<html lang="en">

<meta charset="UTF-8">

<style>

  :root {
    --win-bg: #c0c0c0;
    --win-dark: #808080;
    --win-light: #dfdfdf;
    --win-title: #000080;
    --term-bg: #0c0c0c;
    --term-fg: #00ff41;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #008080;
    font-family: 'MS Sans Serif', 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .window {
    position: absolute;
    inset: 8px;
    background: var(--win-bg);
    border: 2px solid;
    border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
    display: flex;
    flex-direction: column;
    box-shadow: 3px 3px 0 #000;
  }

  .title-bar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: white;
    padding: 4px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: bold;
    height: 26px;
    flex-shrink: 0;
  }

  .title-bar .buttons { display: flex; gap: 3px; }
  .title-btn {
    width: 18px; height: 16px;
    background: var(--win-bg);
    border: 1px solid;
    border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
    font-size: 11px;
    line-height: 14px;
    text-align: center;
    color: #000;
    cursor: pointer;
  }

  .menu-bar {
    background: var(--win-bg);
    border-bottom: 1px solid var(--win-dark);
    padding: 3px 6px;
    font-size: 12px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .menu-item { padding: 2px 5px; cursor: pointer; }
  .menu-item:hover { background: var(--win-title); color: #fff; }

  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  .toolbox {
    width: 200px;
    min-width: 180px;
    background: var(--win-bg);
    border-right: 2px solid var(--win-dark);
    padding: 6px;
    overflow-y: auto;
    font-size: 12px;
    flex-shrink: 0;
  }
  .toolbox h3 {
    background: var(--win-title);
    color: #fff;
    padding: 4px 6px;
    margin: 6px 0 4px;
    font-size: 11px;
  }
  .toolbox h3:first-child { margin-top: 0; }

  .tool-btn {
    display: block;
    width: 100%;
    background: var(--win-bg);
    border: 2px solid;
    border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
    padding: 7px 8px;
    margin-bottom: 3px;
    text-align: left;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    -webkit-user-select: none;
  }
  .tool-btn:active {
    border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
    background: #d4d0c8;
  }

  .terminal-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #000;
    border: 2px inset #808080;
    min-width: 0;
  }
  .term-header {
    background: #1a1a1a;
    color: #aaa;
    padding: 4px 8px;
    font-size: 11px;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;

  #terminal {

    background: var(--term-bg);
    color: var(--term-fg);

    font-size: 12.5px;
    padding: 8px;
    overflow-y: auto;

    line-height: 1.35;
    -webkit-overflow-scrolling: touch;

    padding: 6px 8px;

    flex-shrink: 0;

  .prompt { color: #00cc00; margin-right: 6px; white-space: nowrap; }
  #cmdInput {

    border: none;
    color: var(--term-fg);

    border-left: 2px solid var(--win-dark);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playClick() {
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 780 + Math.random() * 180;
    o.type = 'square';
    g.gain.setValueAtTime(0.07, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    o.start(); o.stop(audioCtx.currentTime + 0.05);
  } catch(e) {}
}

function playBeep(freq=440, dur=0.09) {
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

const term = document.getElementById('terminal');
const cmdInput = document.getElementById('cmdInput');
let typing = false;

function addTerm(text, color) {
  const line = document.createElement('div');
  if (color) line.style.color = color;
  line.textContent = text;
  term.appendChild(line);
  term.scrollTop = term.scrollHeight;
}

function typeOut(lines, speed=15, cb) {
  if (typing) return;
  typing = true;
  let i = 0;
  function next() {
    if (i >= lines.length) { typing = false; if (cb) cb(); return; }
    const line = lines[i];
    if (typeof line === 'string') {
      addTerm(line); playClick();
    } else if (line.delay) {
      setTimeout(() => { i++; next(); }, line.delay); return;
    } else if (line.text) {
      addTerm(line.text, line.color); playClick();
    }
    i++;
    setTimeout(next, speed + Math.random()*8);
  }
  next();
}

function runTool(name) {
  playClick();
  playBeep(620, 0.07);
  document.getElementById('statusAction').textContent = name.toUpperCase();

  if (name === 'clear') {
    term.innerHTML = '';
    addTerm('Terminal cleared.');
    document.getElementById('statusAction').textContent = 'Ready';
    return;
  }

  const output = tools[name] || ['Module not found.'];
  addTerm('');
  addTerm('> ' + name, '#00ccff');
  typeOut(output, 14, () => {
    document.getElementById('statusAction').textContent = 'Ready';
    playBeep(880, 0.1);
  });
}

cmdInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const cmd = cmdInput.value.trim().toLowerCase();
    cmdInput.value = '';
    playClick();
    if (!cmd) return;
    addTerm('root@vitor-box:~# ' + cmd);
    if (cmd === 'help') {
      typeOut([
        'Modules:',
        '  recon   : nmap whois dns subdomain',
        '  exploit : msf sqlmap hydra hashcat',
        '  stress  : ddos slowloris udp',
        '  steal   : discord roblox crypto browser steam',
        '  post    : mimikatz empire c2',
        '  sys     : status clear github'
      ]);
    } else if (tools[cmd]) {
      runTool(cmd);
    } else {
      addTerm(cmd + ': command not found', '#ff5555');
    }
  }
});

function vitorSay(text) {
  const d = document.createElement('div');
  d.className = 'vitor-msg';
  d.textContent = text;
  vitorChat.appendChild(d);
  vitorChat.scrollTop = vitorChat.scrollHeight;
  playBeep(500, 0.05);
}

function userSay(text) {
  const d = document.createElement('div');
  d.className = 'vitor-msg user';
  d.textContent = text;
  vitorChat.appendChild(d);
  vitorChat.scrollTop = vitorChat.scrollHeight;
}

document.getElementById('vitorSend').onclick = () => {
  const t = document.getElementById('vitorInput').value.trim();
  if (!t) return;
  playClick();
  userSay(t);
  document.getElementById('vitorInput').value = '';
  setTimeout(() => vitorSay(vitorReplies[Math.floor(Math.random()*vitorReplies.length)]), 500 + Math.random()*700);
};
document.getElementById('vitorInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('vitorSend').click();
});

  const t = new Date().toTimeString().slice(0,8);
