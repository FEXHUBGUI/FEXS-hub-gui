<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="description" content="VitorAI - Your personal Jarvis-style voice assistant" />
  <link rel="manifest" href="manifest.json" />
  <title>VitorAI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0a0e17;
      --cyan: #00f0ff;
      --cyan-dim: #00a8b3;
      --text: #e0f7fa;
      --glow: 0 0 20px rgba(0, 240, 255, 0.4), 0 0 40px rgba(0, 240, 255, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(0, 80, 100, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 40, 60, 0.15) 0%, transparent 50%);
    }

    header {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding-top: 12px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--cyan);
      text-shadow: var(--glow);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.75rem;
      opacity: 0.6;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .orb-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00f0ff 0%, #006680 40%, #002030 70%, #000 100%);
      box-shadow:
        0 0 30px rgba(0, 240, 255, 0.5),
        0 0 60px rgba(0, 240, 255, 0.25),
        inset 0 0 40px rgba(0, 240, 255, 0.3);
      transition: all 0.4s ease;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(0, 240, 255, 0.3);
      animation: rotate 12s linear infinite;
    }

    .orb.listening {
      box-shadow:
        0 0 50px rgba(0, 240, 255, 0.8),
        0 0 100px rgba(0, 240, 255, 0.4),
        inset 0 0 50px rgba(0, 240, 255, 0.5);
      transform: scale(1.08);
    }

    .orb.speaking {
      animation: pulse 1.2s ease-in-out infinite;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0, 240, 255, 0.15);
      animation: expand 3s ease-out infinite;
    }

    .ring:nth-child(1) { width: 160px; height: 160px; animation-delay: 0s; }
    .ring:nth-child(2) { width: 190px; height: 190px; animation-delay: 0.8s; }
    .ring:nth-child(3) { width: 220px; height: 220px; animation-delay: 1.6s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: 0.85; }
    }

    @keyframes expand {
      0% { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 1rem;
      text-align: center;
      min-height: 1.5em;
      opacity: 0.9;
      max-width: 320px;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .transcript {
      font-size: 0.85rem;
      color: var(--cyan-dim);
      text-align: center;
      min-height: 2.4em;
      max-width: 340px;
      opacity: 0.8;
      padding: 0 10px;
    }

    .controls {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 24px;
    }

    button {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 100, 120, 0.2));
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: var(--cyan);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 14px 24px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    button:hover, button:active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(0, 140, 160, 0.35));
      box-shadow: var(--glow);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .secondary {
      background: transparent;
      border-color: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
    }

    .chat-log {
      width: 100%;
      max-width: 380px;
      max-height: 140px;
      overflow-y: auto;
      font-size: 0.8rem;
      opacity: 0.7;
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(0, 20, 30, 0.4);
      display: none;
    }

    .chat-log.visible {
      display: block;
    }

    .chat-log div {
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .chat-log .user { color: #7dd3fc; }
    .chat-log .ai { color: var(--cyan); }

    .hint {
      font-size: 0.7rem;
      opacity: 0.45;
      text-align: center;
      max-width: 300px;
      line-height: 1.4;
    }

    /* Install banner */
    .install-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 20, 30, 0.95);
      border-top: 1px solid rgba(0, 240, 255, 0.3);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 100;
      text-align: center;
      font-size: 0.85rem;
    }

    .install-banner.visible {
      display: flex;
    }

    .install-banner button {
      padding: 8px 20px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>VITORAI</h1>
    <div class="subtitle">Personal Assistant</div>
  </header>

  <div class="orb-container">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="orb" id="orb" title="Tap to activate"></div>
  </div>

  <div class="status" id="status">Tap the orb or say “Hey VitorAI”</div>
  <div class="transcript" id="transcript"></div>

  <div class="chat-log" id="chatLog"></div>

  <div class="controls">
    <button id="mainBtn">Activate</button>
    <button class="secondary" id="stopBtn" style="display:none;">Stop Listening</button>
    <button class="secondary" id="clearBtn">Clear History</button>
  </div>

  <p class="hint">
    Works best in Safari. Allow microphone access.<br>
    Say “Hey VitorAI” then ask anything.<br>
    Add to Home Screen for app-like experience.
  </p>

  <div class="install-banner" id="installBanner">
    <span>Install VitorAI on your home screen for the best experience</span>
    <div style="display:flex;gap:10px;">
      <button id="installOk">Got it</button>
    </div>
  </div>

  <script>
    // ========== Config ==========
    const WAKE_PHRASES = ["hey vitorai", "hey vitor ai", "hey vitor", "vitorai", "vitor ai", "okay vitorai"];
    const SYSTEM_PROMPT = `You are VitorAI, a highly advanced personal AI assistant inspired by JARVIS from Iron Man.
You speak in a calm, polite, slightly formal British-tinged tone.
Address the user as "sir" or "ma'am" when appropriate.
Be helpful, concise, witty when suitable, and always professional.
Keep answers relatively short for speech (2-4 sentences max unless asked for detail).
If you don't know something, admit it gracefully.`;

    // ========== State ==========
    let recognition = null;
    let isListening = false;
    let isSpeaking = false;
    let conversation = [];
    let wakeMode = true; // waiting for wake phrase
    let lastTranscript = "";

    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const orb = document.getElementById("orb");
    const mainBtn = document.getElementById("mainBtn");
    const stopBtn = document.getElementById("stopBtn");
    const chatLog = document.getElementById("chatLog");
    const clearBtn = document.getElementById("clearBtn");

    // ========== Speech Recognition ==========
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function initRecognition() {
      if (!SpeechRecognition) {
        statusEl.textContent = "Speech recognition not supported in this browser";
        mainBtn.disabled = true;
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        orb.classList.add("listening");
        mainBtn.style.display = "none";
        stopBtn.style.display = "block";
        updateStatus(wakeMode ? "Listening for “Hey VitorAI”…" : "Listening…");
      };

      recognition.onend = () => {
        isListening = false;
        orb.classList.remove("listening");
        if (!isSpeaking) {
          // Auto-restart if we want continuous listening (careful on iOS)
          // For reliability on iOS we restart only if still wanted
        }
        mainBtn.style.display = "block";
        stopBtn.style.display = "none";
        if (!isSpeaking) updateStatus("Tap the orb to activate");
      };

      recognition.onerror = (e) => {
        console.warn("Recognition error:", e.error);
        if (e.error === "not-allowed") {
          updateStatus("Microphone permission denied");
        } else if (e.error !== "aborted" && e.error !== "no-speech") {
          updateStatus("Listening error – try again");
        }
      };

      recognition.onresult = (event) => {
        let interim = "";
        let final = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            final += t;
          } else {
            interim += t;
          }
        }

        const current = (final || interim).trim();
        if (current) {
          transcriptEl.textContent = current;
          lastTranscript = current.toLowerCase();
        }

        if (final) {
          handleFinalTranscript(final.trim());
        }
      };
    }

    function startListening() {
      if (!recognition || isListening || isSpeaking) return;
      try {
        recognition.start();
      } catch (e) {
        console.warn(e);
        // already started
      }
    }

    function stopListening() {
      if (recognition && isListening) {
        try { recognition.stop(); } catch (e) {}
      }
    }

    // ========== Speech Synthesis ==========
    function speak(text, onEnd) {
      if (!window.speechSynthesis) {
        if (onEnd) onEnd();
        return;
      }

      // Cancel any ongoing
      speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 0.95;
      utter.pitch = 0.95;
      utter.volume = 1;

      // Prefer a good male / British voice if available
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v =>
        /daniel|arthur|google uk english male|microsoft david|alex|fred/i.test(v.name)
      ) || voices.find(v => v.lang.startsWith("en") && /male/i.test(v.name))
        || voices.find(v => v.lang.startsWith("en-GB"))
        || voices.find(v => v.lang.startsWith("en"));

      if (preferred) utter.voice = preferred;

      isSpeaking = true;
      orb.classList.add("speaking");
      orb.classList.remove("listening");
      updateStatus("Speaking…");

      utter.onend = () => {
        isSpeaking = false;
        orb.classList.remove("speaking");
        if (onEnd) onEnd();
        // After speaking, go back to wake mode and listen again
        wakeMode = true;
        setTimeout(() => startListening(), 400);
      };

      utter.onerror = () => {
        isSpeaking = false;
        orb.classList.remove("speaking");
        if (onEnd) onEnd();
      };

      // iOS requires speak() to be called from a user gesture in some cases.
      // We already have a gesture from the button/orb, so it should be fine.
      speechSynthesis.speak(utter);
    }

    // ========== AI Response ==========
    async function getAIResponse(userText) {
      // Local Jarvis-style fallback first for speed / offline
      const lower = userText.toLowerCase();

      // Quick local responses
      if (/^(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(lower)) {
        return "Good day, sir. VitorAI at your service. How may I assist you?";
      }
      if (/what time|current time|what's the time/.test(lower)) {
        return `The time is currently ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}, sir.`;
      }
      if (/what day|what date|today's date/.test(lower)) {
        return `Today is ${new Date().toLocaleDateString([], {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'})}, sir.`;
      }
      if (/who are you|what are you|your name/.test(lower)) {
        return "I am VitorAI, your personal artificial intelligence assistant. Inspired by the finest digital butlers of fiction, ready to help whenever you need me.";
      }
      if (/thank you|thanks/.test(lower)) {
        return "You're most welcome, sir. Always a pleasure.";
      }
      if (/joke|make me laugh|tell me something funny/.test(lower)) {
        const jokes = [
          "Why do programmers prefer dark mode? Because light attracts bugs, sir.",
          "I would tell you a UDP joke, but you might not get it.",
          "There are 10 types of people in the world: those who understand binary and those who don't."
        ];
        return jokes[Math.floor(Math.random() * jokes.length)];
      }

      // Try a free no-key endpoint (may be rate-limited or change)
      try {
        const messages = [
          { role: "system", content: SYSTEM_PROMPT },
          ...conversation.slice(-6), // last few turns
          { role: "user", content: userText }
        ];

        // Using a free public endpoint – replace if it stops working
        const res = await fetch("https://vireonix.ai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "auto",
            messages: messages,
            max_tokens: 180,
            temperature: 0.7
          })
        });

        if (res.ok) {
          const data = await res.json();
          const reply = data.choices?.[0]?.message?.content?.trim();
          if (reply) return reply;
        }
      } catch (err) {
        console.warn("AI endpoint failed, using fallback", err);
      }

      // Graceful fallback
      return "I'm afraid my advanced knowledge systems are temporarily limited, sir. I can still help with time, simple questions, or just keep you company. What else can I do for you?";
    }

    // ========== Main logic ==========
    function handleFinalTranscript(text) {
      if (!text) return;

      const lower = text.toLowerCase();

      if (wakeMode) {
        // Check for wake phrase
        const isWake = WAKE_PHRASES.some(p => lower.includes(p));
        if (isWake) {
          wakeMode = false;
          transcriptEl.textContent = "";
          updateStatus("At your service…");
          speak("At your service. How may I help you?", () => {
            // already restarts listening in speak onend
          });
        }
        // ignore other speech while waiting for wake
        return;
      }

      // We are in command mode – process the question
      stopListening();
      transcriptEl.textContent = text;
      addToLog("user", text);
      updateStatus("Thinking…");

      conversation.push({ role: "user", content: text });

      getAIResponse(text).then(reply => {
        conversation.push({ role: "assistant", content: reply });
        addToLog("ai", reply);
        speak(reply);
      }).catch(() => {
        const fallback = "My apologies, sir. I encountered a temporary difficulty. Please try again.";
        speak(fallback);
      });
    }

    function updateStatus(msg) {
      statusEl.textContent = msg;
    }

    function addToLog(who, text) {
      chatLog.classList.add("visible");
      const div = document.createElement("div");
      div.className = who;
      div.textContent = (who === "user" ? "You: " : "VitorAI: ") + text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // ========== UI Events ==========
    function activate() {
      if (isSpeaking) {
        speechSynthesis.cancel();
        isSpeaking = false;
        orb.classList.remove("speaking");
      }
      wakeMode = true;
      startListening();
    }

    orb.addEventListener("click", activate);
    mainBtn.addEventListener("click", activate);

    stopBtn.addEventListener("click", () => {
      stopListening();
      wakeMode = true;
      updateStatus("Stopped. Tap to activate again.");
    });

    clearBtn.addEventListener("click", () => {
      conversation = [];
      chatLog.innerHTML = "";
      chatLog.classList.remove("visible");
      transcriptEl.textContent = "";
      updateStatus("History cleared. Ready when you are.");
    });

    // Load voices (async on some browsers)
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => {};
    }

    // Init
    initRecognition();

    // Simple install tip for iOS
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true;
    if (isIos && !isStandalone && !localStorage.getItem("vitorai-install-seen")) {
      setTimeout(() => {
        document.getElementById("installBanner").classList.add("visible");
      }, 2500);
    }
    document.getElementById("installOk").addEventListener("click", () => {
      document.getElementById("installBanner").classList.remove("visible");
      localStorage.setItem("vitorai-install-seen", "1");
    });

    // Welcome on first load (only if user has interacted once, but we skip auto-speak for iOS policy)
    updateStatus("Tap the orb or the button to begin");
  </script>
</body>
</html>
